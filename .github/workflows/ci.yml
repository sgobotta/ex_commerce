name: CI

on:
  # This action is triggered on any branch that opens a pull request.
  pull_request:
    branches:
      - "*"
    # This action is not triggered when markdown files are modified.
    paths-ignore:
      - '**.md'

jobs:
  job1:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v2.3.4 # Necessary to access local action
      - name: Local Action Call
        id: local-action
        uses: ./.github/actions/local-action
        with:
          name: "World"
      - name: Local Action Output
        run: echo "${{ steps.local-action.outputs.random }}"
